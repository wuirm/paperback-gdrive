<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Google sign-in code</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #5f6673; --accent: #1a73e8; --border: #dde1e7; --err: #c5221f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --accent: #8ab4f8; --border: #2b3039; --err: #f28b82; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
           border-radius: 16px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--muted); }
    code { display: block; word-break: break-all; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
           font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); color: var(--text);
           user-select: all; -webkit-user-select: all; margin-bottom: 16px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
             font: 600 16px/1 inherit; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #0f1115; } }
    .error { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Google sign-in code</h1>
    <p id="intro">Loading…</p>
    <code id="code" hidden></code>
    <button id="copy" hidden type="button">Copy code</button>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get("code");
      var error = params.get("error");
      var intro = document.getElementById("intro");
      var box = document.getElementById("code");
      var copy = document.getElementById("copy");
      // Drop the code from the address bar and history once it's on screen.
      if (code || error) history.replaceState(null, "", location.pathname);
      if (error) {
        document.getElementById("title").textContent = "Sign-in didn't complete";
        intro.className = "error";
        intro.textContent = "Google returned: " + error + ". Go back to the chat and try the sign-in link again.";
        return;
      }
      if (!code) {
        intro.textContent = "This page shows the one-time code Google sends after you sign in to the Paperback Google Drive extension. Open the sign-in link from the chat to get one.";
        return;
      }
      intro.textContent = "Copy this one-time code and paste it back into the Claude chat. It expires in a few minutes.";
      box.textContent = code;
      box.hidden = false;
      copy.hidden = false;
      copy.addEventListener("click", function () {
        var done = function () { copy.textContent = "Copied"; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, function () { selectCode(); });
        } else { selectCode(); }
      });
      function selectCode() {
        var range = document.createRange();
        range.selectNodeContents(box);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        copy.textContent = "Selected; tap Copy in the menu";
      }
    })();
  </script>
</body>
</html>
