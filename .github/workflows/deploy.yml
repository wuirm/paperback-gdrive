name: Bundle and deploy to GitHub Pages

# Builds the extension and publishes ./bundles to the gh-pages branch,
# which GitHub Pages serves at https://<user>.github.io/<repo>/.
#
# Third-party actions are pinned to a specific commit SHA (not a floating tag
# like @v4) so a compromised or moved tag can't run new code in this repo, which
# has contents:write. The trailing comment records the human-readable version.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy step needs write, and nothing needs anything else.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bundle-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc -p .
      - run: npm run bundle
      - run: touch bundles/.nojekyll
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
