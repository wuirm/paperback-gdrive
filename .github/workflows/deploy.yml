name: Release to GitHub Pages

# Publishes the extension only when a release tag (v1.2.3) is pushed, or when run
# by hand from the Actions tab. Pushing to main does NOT reach users; that keeps
# work-in-progress off everyone's phones. To release: bump `version` in
# src/GoogleDrive/pbconfig.ts, commit, then push a tag with the same version.
#
# Third-party actions are pinned to a commit SHA (not a movable tag like @v4), so
# a compromised tag can't run new code in a job that can write to this repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -e "const s=require('fs').readFileSync('src/GoogleDrive/pbconfig.ts','utf8');console.log(s.match(/version:\s*\"([^\"]+)\"/)[1])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pbconfig version $version"
            exit 1
          fi
      - run: npx tsc -p .
      - run: npm test
      - run: touch bundles/.nojekyll
      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
