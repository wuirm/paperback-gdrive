name: Bundle and deploy to GitHub Pages

# Builds the extension and publishes ./bundles to the gh-pages branch,
# which GitHub Pages serves at https://<user>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bundle-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm run bundle
      - run: touch bundles/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
